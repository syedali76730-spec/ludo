<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a1c"><title>Neon Ludo Score Tracker</title>
<style>
:root{--bg:#080a1c;--panel:#121834;--text:#f5f7ff;--muted:#a4aed5;--red:#ff3d64;--green:#2cff9a;--yellow:#ffe34f;--blue:#31a8ff;--purple:#9868ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;margin:0}body{overflow-x:hidden;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(680px 500px at 0% 0%,#ff3d6470,transparent 63%),radial-gradient(680px 500px at 100% 0%,#31a8ff66,transparent 63%),radial-gradient(680px 540px at 0% 100%,#2cff9a4a,transparent 63%),radial-gradient(680px 520px at 100% 100%,#ffe34f45,transparent 63%),radial-gradient(500px 360px at 50% 45%,#9868ff33,transparent 70%),var(--bg)}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(135deg,transparent 0%,#ff3d6418 25%,transparent 40%,#2cff9a16 53%,transparent 66%,#31a8ff18 82%,#ffe34f14 100%)}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}#app{max-width:500px;min-height:100dvh;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}.header{display:flex;gap:12px;align-items:center}.logo{width:49px;height:49px;padding:3px;border-radius:16px;background:conic-gradient(var(--red),var(--yellow),var(--green),var(--blue),var(--red));box-shadow:0 0 13px #ff3d64aa,0 0 21px #31a8ff77}.logo i{display:block;width:100%;height:100%;background:#080a1c;border-radius:13px}.header h1{margin:0;font-size:20px}.header p,.sub{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.menu,.card,.score{border:1px solid #ffffff1a;border-radius:19px;background:linear-gradient(135deg,#181e43e8,#0d1129f0);box-shadow:0 12px 26px #0004}.menu{padding:16px;width:100%;display:flex;align-items:center;gap:14px;color:var(--text);text-align:left}.menu:active,.btn:active,.chip:active{transform:scale(.975)}.ico{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;font-size:22px}.new{background:linear-gradient(135deg,#2cff9a55,#31a8ff55)}.board{background:linear-gradient(135deg,#ffe34f55,#ff3d6455)}.person{background:linear-gradient(135deg,#31a8ff55,#9868ff55)}.menu strong{font-size:17px}.menu small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.title{display:flex;align-items:center;gap:10px}.title h2{font-size:22px;margin:0}.back{border:0;width:40px;height:40px;border-radius:12px;background:#1b234a;color:#fff;font-size:21px}.card{padding:16px}.label{margin-bottom:11px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.85px;text-transform:uppercase}.btn{border:0;border-radius:14px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#a36cff,#6643e6);box-shadow:0 6px 20px #7549e766;font-size:16px;font-weight:800}.btn.secondary{background:#171e42;border:1px solid #ffffff1c;box-shadow:none}.btn.danger{background:linear-gradient(135deg,#ff4969,#d91f48)}.full{width:100%}.row{display:flex;gap:10px}.row>*{flex:1}.row .btn{flex:0 0 94px}input{min-width:0;padding:14px 15px;border:1px solid #ffffff1a;border-radius:14px;outline:0;background:#202950;color:#fff;font-size:16px}input:focus{border-color:var(--purple)}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border:2px solid transparent;background:#202950;color:#fff;border-radius:999px;padding:9px 14px;font-weight:700}.chip.selected{border-color:var(--purple);background:linear-gradient(135deg,#6535e866,#202b69)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:#7f89af}.selected .dot{background:#b091ff;box-shadow:0 0 10px var(--purple)}.empty{color:var(--muted);font-size:14px}.score{position:relative;overflow:hidden;padding:15px 16px;border-left:5px solid var(--c)}.score:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,color-mix(in srgb,var(--c) 28%,transparent),transparent 55%)}.top,.controls{position:relative;display:flex}.top{justify-content:space-between;align-items:center;margin-bottom:11px}.pname{font-size:16px;font-weight:800}.pname i{font-style:normal;color:var(--c);text-shadow:0 0 11px var(--c)}.points{color:var(--c);font-size:28px;font-weight:900;text-shadow:0 0 13px var(--c)}.controls{gap:8px}.controls button{flex:1;border:0;border-radius:11px;padding:11px 0;background:#222b54;color:#f4f6ff;font-size:15px;font-weight:900}.controls .minus{color:#ff7990;background:#ff3d6420}.controls .plus{color:#64ffbb;background:#2cff9a1b}.spacer{flex:1}table{width:100%;border-collapse:collapse;font-size:14px}th{padding:6px;text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase}td{padding:11px 6px;border-top:1px solid #ffffff10}.center{text-align:center}.pills{display:flex;gap:5px;margin-top:5px}.pill{border-radius:8px;padding:3px 7px;font-size:10px;font-weight:800}.w{color:#5dffb7;background:#2cff9a1b}.l{color:#ff7990;background:#ff3d641b}.d{color:#ffeb72;background:#ffe34f1b}.delete{border:0;background:transparent;color:var(--muted);font-size:15px}.history{display:flex;justify-content:space-between;gap:8px;padding:11px 4px;border-top:1px solid #ffffff12;font-size:14px}.history small{color:var(--muted);white-space:nowrap}.spacer{flex:1}.overlay{position:fixed;z-index:20;inset:0;display:flex;align-items:flex-end;justify-content:center;background:#030516ca;backdrop-filter:blur(7px)}.modal{width:100%;max-width:500px;max-height:88dvh;overflow:auto;padding:23px 18px calc(28px + env(safe-area-inset-bottom));border:1px solid #ffffff18;border-radius:25px 25px 0 0;background:linear-gradient(145deg,#1c234d,#101530)}.modal h3{margin:0 0 6px;font-size:21px}.modal p{margin:0 0 17px;color:var(--muted);font-size:13px;line-height:1.45}.choice{display:flex;width:100%;align-items:center;justify-content:space-between;margin:10px 0;padding:14px 15px;border:2px solid transparent;border-radius:15px;background:#28315a;color:#fff;font-size:17px;font-weight:800;text-align:left}.choice.leader{border-color:var(--yellow);box-shadow:0 0 16px #ffe34f40}.choice small{color:#afb9df;font-size:13px}.modal .btn{margin-top:12px}.result{text-align:center;padding:20px 0 8px}.emoji{font-size:64px;filter:drop-shadow(0 0 15px #ffe34f99)}.result h2{margin:7px 0 2px;font-size:25px}.result p{margin:0;color:var(--muted);font-size:14px}.toast{position:fixed;z-index:40;left:50%;bottom:30px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;padding:11px 18px;border-radius:999px;background:#2d3766;color:#fff;font-size:14px;font-weight:700}.toast.on{opacity:1;transform:translate(-50%,0)}.sync{font-size:11px;color:var(--muted);text-align:center}.sync.ok{color:#60ffb7}.sync.warn{color:#ffe36c}
</style></head><body><main id="app"></main><div id="toast" class="toast"></div>
<script>
/* Place this HTML at repository root and the JSON at data/ludo-data.json.
   To enable GitHub updates, deploy a secure serverless endpoint at /api/ludo-data.
   It must read/commit data/ludo-data.json using a GitHub token stored server-side. */
(()=>{const DATA_URL='./data/ludo-data.json',API_URL='/api/ludo-data',LOCAL_KEY='ludo_score_tracker_json_cache_v1',COL=[['#ff3d64','Red'],['#2cff9a','Green'],['#ffe34f','Yellow'],['#31a8ff','Blue']];let db={version:1,updatedAt:null,players:[],games:[]},view='home',selected=[],game,last,syncState='Loading shared data…';const app=document.querySelector('#app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function get(i){return db.players.find(p=>p.id===i)}function rate(p){let n=p.wins+p.losses+p.draws;return n?Math.round(p.wins/n*100):0}function note(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('on');clearTimeout(window.nt);window.nt=setTimeout(()=>t.classList.remove('on'),2200)}function cache(){localStorage.setItem(LOCAL_KEY,JSON.stringify(db))}
async function load(){try{let r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();let data=await r.json();if(!Array.isArray(data.players)||!Array.isArray(data.games))throw Error();db=data;syncState='Loaded from shared JSON';cache()}catch(e){try{let x=JSON.parse(localStorage.getItem(LOCAL_KEY));if(x?.players){db=x;syncState='Offline copy loaded'}else syncState='JSON file not found yet'}catch(e2){syncState='Starting new local game data'}}render()}
async function persist(){db.updatedAt=new Date().toISOString();cache();render();try{let r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)});if(!r.ok)throw Error();syncState='Saved to shared JSON';cache()}catch(e){syncState='Saved only on this device — API sync not connected'}render()}
function add(n){n=n.trim();if(!n)return null;let same=db.players.find(p=>p.name.toLowerCase()===n.toLowerCase());if(same){note(n+' already exists');return same}let p={id:uid(),name:n,wins:0,losses:0,draws:0,createdAt:new Date().toISOString()};db.players.push(p);persist();return p}
function render(){let f={home,newGame,game:play,board,create,result}[view]||home;app.innerHTML=f();bind()}function status(){let cls=syncState.includes('Loaded')||syncState.includes('shared')?'ok':syncState.includes('only')||syncState.includes('not found')?'warn':'';return`<div class="sync ${cls}">● ${esc(syncState)}</div>`}function home(){return`<header class="header"><div class="logo"><i></i></div><div><h1>Ludo Score Tracker</h1><p>${db.players.length} player${db.players.length==1?'':'s'} · ${db.games.length} game${db.games.length==1?'':'s'} played</p></div></header><button class="menu" data-nav="newGame"><span class="ico new">🎲</span><span><strong>New Game</strong><small>Start scoring a fresh match</small></span></button><button class="menu" data-nav="board"><span class="ico board">🏆</span><span><strong>Check Score Board</strong><small>Wins, losses and draws</small></span></button><button class="menu" data-nav="create"><span class="ico person">👤</span><span><strong>Create Player</strong><small>Add someone to your roster</small></span></button><div class="spacer"></div>${status()}`}
function newGame(){let chips=db.players.map(p=>`<button class="chip ${selected.includes(p.id)?'selected':''}" data-toggle="${p.id}"><i class="dot"></i>${esc(p.name)}</button>`).join('');return`<div class="title"><button class="back" data-nav="home">←</button><h2>New Game</h2></div><p class="sub">Select 2–4 players. A new name is saved automatically.</p><section class="card"><div class="label">Select players (${selected.length}/4)</div>${chips?`<div class="chips">${chips}</div>`:'<p class="empty">No players yet — add the first one below.</p>'}</section><section class="card"><div class="label">Add new player</div><div class="row"><input id="quick" maxlength="20" placeholder="Player name"><button class="btn" data-act="quick">Add</button></div></section><div class="spacer"></div><button class="btn full" data-act="start" ${selected.length<2?'disabled':''}>🎲 Start Game</button>`}
function play(){return`<div class="title"><button class="back" data-act="quit">←</button><h2>Game On! 🎲</h2></div><p class="sub">Track points each round, then record the winner.</p>${game.players.map(p=>`<article class="score" style="--c:${p.color}"><div class="top"><div class="pname"><i>●</i> ${esc(p.name)} <small style="color:var(--muted)">(${p.colorName})</small></div><div class="points">${game.scores[p.id]}</div></div><div class="controls"><button class="minus" data-score="${p.id}|-1">−1</button><button class="plus" data-score="${p.id}|1">+1</button><button class="plus" data-score="${p.id}|5">+5</button><button class="plus" data-score="${p.id}|10">+10</button></div></article>`).join('')}<div class="spacer"></div><button class="btn full" data-act="end">🏁 End Game</button>`}
function board(){if(!db.players.length)return`<div class="title"><button class="back" data-nav="home">←</button><h2>Score Board</h2></div><section class="card" style="text-align:center;padding:36px 16px"><div style="font-size:44px">🏆</div><h3>No players yet</h3><p class="sub">Create players to begin tracking.</p><br><button class="btn full" data-nav="create">Create Player</button></section>`;let rows=[...db.players].sort((a,b)=>b.wins-a.wins||rate(b)-rate(a)).map((p,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td><strong>${esc(p.name)}</strong><div class="pills"><span class="pill w">W ${p.wins}</span><span class="pill l">L ${p.losses}</span><span class="pill d">D ${p.draws}</span></div></td><td class="center">${rate(p)}%</td><td class="center"><button class="delete" data-del="${p.id}">🗑</button></td></tr>`).join('');let h=db.games.slice(0,10).map(g=>`<div class="history"><span>${esc(g.winnerId===null?'Draw 🤝':(g.players.find(p=>p.id===g.winnerId)?.name||'?')+' won 🏆')}</span><small>${new Date(g.playedAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</small></div>`).join('');return`<div class="title"><button class="back" data-nav="home">←</button><h2>Score Board</h2></div><section class="card"><div class="label">All players (${db.players.length})</div><table><tr><th>#</th><th>Player</th><th class="center">Win rate</th><th></th></tr>${rows}</table></section>${h?`<section class="card"><div class="label">Recent games</div>${h}</section>`:''}`}
function create(){return`<div class="title"><button class="back" data-nav="home">←</button><h2>Create Player</h2></div><p class="sub">New players are written to the JSON file when the secure sync API is connected.</p><section class="card"><div class="label">Player name</div><input id="newname" maxlength="20" placeholder="e.g. Ali"><br><br><button class="btn full" data-act="create">👤 Create Player</button></section>${db.players.length?`<section class="card"><div class="label">Existing players</div>${db.players.map(p=>`<div class="history"><span>${esc(p.name)}</span><small>${p.wins}W · ${p.losses}L · ${p.draws}D</small></div>`).join('')}</section>`:''}`}
function result(){let g=last.game,w=last.winnerId===null?null:g.players.find(p=>p.id===last.winnerId);return`<section class="result"><div class="emoji">${w?'🏆':'🤝'}</div><h2>${w?esc(w.name)+' wins!':'It’s a Draw!'}</h2><p>${w?g.scores[w.id]+' points — result saved.':'A draw was saved for every player.'}</p></section><section class="card"><div class="label">Final scores</div>${g.players.map(p=>`<div class="history"><span>${esc(p.name)}${p.id===last.winnerId?' 🏆':''}</span><small>${g.scores[p.id]} pts</small></div>`).join('')}</section><button class="btn full" data-nav="newGame">🎲 Play Again</button><button class="btn secondary full" data-nav="board">🏆 View Score Board</button>`}
function bind(){app.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>{view=x.dataset.nav;render()});app.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>{let i=x.dataset.toggle;if(selected.includes(i))selected=selected.filter(v=>v!==i);else if(selected.length<4)selected.push(i);else note('Maximum four players');render()});app.querySelectorAll('[data-score]').forEach(x=>x.onclick=()=>{let[a,b]=x.dataset.score.split('|');game.scores[a]=Math.max(0,game.scores[a]+Number(b));render()});app.querySelectorAll('[data-act]').forEach(x=>x.onclick=()=>act(x.dataset.act));app.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{if(confirm('Delete '+get(x.dataset.del).name+'?')){db.players=db.players.filter(p=>p.id!==x.dataset.del);persist();render()}});['quick','newname'].forEach(i=>{let x=document.querySelector('#'+i);if(x)x.onkeydown=e=>{if(e.key==='Enter')act(i==='quick'?'quick':'create')}})}
function act(a){if(a==='quick'){let p=add(document.querySelector('#quick').value);if(p&&!selected.includes(p.id)&&selected.length<4)selected.push(p.id);render()}if(a==='create'){let n=document.querySelector('#newname').value;if(!n.trim())return note('Enter a name');add(n);render()}if(a==='start'){let ps=selected.map((id,i)=>({id,name:get(id).name,color:COL[i][0],colorName:COL[i][1]}));game={players:ps,scores:Object.fromEntries(ps.map(p=>[p.id,0]))};view='game';render()}if(a==='end')winnerModal();if(a==='quit'){if(confirm('Quit without saving this game?')){game=null;selected=[];view='home';render()}}}
function winnerModal(){let leader=game.players.reduce((a,p)=>game.scores[a.id]>=game.scores[p.id]?a:p),o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="modal"><h3>Who won the game?</h3><p>The points leader is highlighted. Tap a player to save the result.</p>${game.players.map(p=>`<button class="choice ${p.id===leader.id?'leader':''}" data-win="${p.id}"><span><b style="color:${p.color}">●</b> ${esc(p.name)} ${p.id===leader.id?'👑':''}</span><small>${game.scores[p.id]} pts</small></button>`).join('')}<button class="choice" data-win="draw"><span>🤝 It was a draw</span><small>Everyone +1 draw</small></button><button class="btn secondary full" data-close>Cancel</button></div>`;document.body.append(o);o.querySelector('[data-close]').onclick=()=>o.remove();o.querySelectorAll('[data-win]').forEach(x=>x.onclick=()=>{o.remove();finish(x.dataset.win==='draw'?null:x.dataset.win)})}
function finish(w){let g=game;g.players.forEach(x=>{let p=get(x.id);if(w===null)p.draws++;else if(x.id===w)p.wins++;else p.losses++});db.games.unshift({id:'g_'+Date.now().toString(36),playedAt:new Date().toISOString(),winnerId:w,scores:{...g.scores},players:g.players.map(p=>({id:p.id,name:p.name}))});db.games=db.games.slice(0,50);last={winnerId:w,game:g};game=null;selected=[];view='result';persist()}
load()})();
</script></body></html>
